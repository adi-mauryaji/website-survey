<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Website opinion survey</title>
<meta name="description" content="Compare two versions of a website and say which works better. About 5 minutes, anonymous.">
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --ink: #15171c; --muted: #4a5160; --line: #c8cdd6;
    --accent: #1646c0; --accent-ink: #ffffff; --soft: #e8eefc; --focus: #e8a900; --warn: #8a4b00;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111317; --panel: #1a1d23; --ink: #eceff4; --muted: #b4bbc8; --line: #3b414d;
      --accent: #92b2ff; --accent-ink: #0c1120; --soft: #222a3d; --focus: #e8a900; --warn: #ffb866;
    }
  }
  * { box-sizing: border-box; }
  html[lang="hi"] body { font-family: system-ui, "Noto Sans Devanagari", sans-serif; line-height: 1.7; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.55 system-ui, sans-serif; }
  main { max-width: 1400px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.6rem; line-height: 1.25; margin: 8px 0; }
  h2 { font-size: 1.15rem; margin: 0 0 8px; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin: 0 0 16px; }
  .narrow { max-width: 720px; }
  fieldset { border: 0; padding: 0; margin: 0 0 16px; }
  legend { font-weight: 600; margin-bottom: 6px; padding: 0; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .opt { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); cursor: pointer; }
  .opt input { width: 20px; height: 20px; margin: 0; }
  select, input[type=text], textarea { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 44px; max-width: 100%; }
  textarea { width: 100%; min-height: 72px; }
  button { font: inherit; min-height: 48px; padding: 10px 18px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button[disabled] { opacity: .5; cursor: not-allowed; }
  button[aria-pressed="true"] { background: var(--soft); outline: 3px solid var(--accent); outline-offset: 1px; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
  .audience { background: var(--panel); border-left: 4px solid var(--accent); padding: 10px 14px; margin: 0 0 12px; }
  .tabs { display: none; gap: 8px; margin: 0 0 8px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .pane { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
  .frame { position: relative; overflow: hidden; height: 72vh; min-height: 480px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  .frame iframe { border: 0; position: absolute; top: 0; left: 0; transform-origin: 0 0; }
  @media (max-width: 899px) {
    .tabs { display: flex; }
    .pair { grid-template-columns: 1fr; }
    .pane[hidden] { display: none; }
  }
  .wait { color: var(--warn); min-height: 1.6em; font-weight: 600; }
  .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; margin: 8px 0 16px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="top">
    <strong data-t="brand"></strong>
    <button type="button" id="langBtn"></button>
  </div>

  <!-- Start: consent and anonymous profile -->
  <section id="start" class="narrow">
    <h1 data-t="title"></h1>
    <p data-t="intro1"></p>
    <p data-t="intro2"></p>
    <div class="card">
      <fieldset>
        <legend data-t="ageQ"></legend>
        <select id="age" aria-label="Age"></select>
      </fieldset>
      <fieldset>
        <legend><label for="region" data-t="regionQ"></label></legend>
        <input id="region" type="text" autocomplete="off">
      </fieldset>
      <fieldset>
        <legend data-t="langsQ"></legend>
        <div class="opts" id="langs"></div>
      </fieldset>
      <fieldset>
        <legend data-t="designerQ"></legend>
        <div class="opts" id="designer"></div>
      </fieldset>
      <label class="opt"><input type="checkbox" id="consent"> <span data-t="consent"></span></label>
    </div>
    <button type="button" class="primary" id="begin" data-t="begin"></button>
    <p class="wait" id="startMsg" role="status"></p>
  </section>

  <!-- Pair -->
  <section id="vote" hidden>
    <div class="bar"><strong id="progress" aria-live="polite"></strong><span class="muted" id="langNote"></span>
      <button type="button" id="view" aria-pressed="false"></button></div>
    <p class="audience" id="audience"></p>
    <div class="tabs" role="group" aria-label="Versions">
      <button type="button" id="tabA" aria-pressed="true"></button>
      <button type="button" id="tabB" aria-pressed="false"></button>
    </div>
    <div class="pair">
      <section class="pane" id="paneA" aria-labelledby="hA"><h2 id="hA"></h2><div class="frame" id="fA"></div></section>
      <section class="pane" id="paneB" aria-labelledby="hB"><h2 id="hB"></h2><div class="frame" id="fB"></div></section>
    </div>

    <div class="card">
      <p class="wait" id="wait" role="status"></p>
      <h2 data-t="whichQ"></h2>
      <div class="choices" role="group" id="choices"></div>
      <div id="details" hidden>
        <fieldset>
          <legend data-t="fitQ"></legend>
          <div class="opts" id="fit"></div>
        </fieldset>
        <fieldset id="reasonsBox">
          <legend data-t="reasonsQ"></legend>
          <div class="opts" id="reasons"></div>
        </fieldset>
        <label for="comment" data-t="commentQ"></label>
        <textarea id="comment"></textarea>
      </div>
      <div class="bar">
        <button type="button" class="primary" id="next" disabled></button>
      </div>
    </div>
  </section>

  <!-- End -->
  <section id="done" class="narrow" hidden>
    <h1 data-t="thanks"></h1>
    <p data-t="thanks2"></p>
    <p class="muted" id="sendState" role="status"></p>
    <div class="bar">
      <button type="button" id="more" data-t="more"></button>
      <button type="button" id="download" data-t="download"></button>
    </div>
  </section>
</main>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
